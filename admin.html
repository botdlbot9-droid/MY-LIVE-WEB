<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Stream</title>
    <link href="https://unpkg.com/video.js@8/dist/video-js.min.css" rel="stylesheet">
    <script src="https://unpkg.com/video.js@8/dist/video.min.js"></script>
    <script src="https://unpkg.com/@videojs/http-streaming@3/dist/videojs-http-streaming.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a12;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
        }
        .container { max-width: 1000px; width: 100%; padding: 20px; }
        .player-wrapper { background: #000; border-radius: 12px; overflow: hidden; aspect-ratio: 16/9; }
        #my-video { width: 100%; height: 100%; display: block; }
        .status-bar {
            display: flex;
            justify-content: space-between;
            padding: 12px 16px;
            background: #12121e;
            border-radius: 10px;
            border: 1px solid #2a2a4e;
            margin-top: 16px;
        }
        .status-item { display: flex; align-items: center; gap: 8px; font-size: 13px; }
        .status-item .label { color: #a0a0b8; }
        .status-item .value { font-weight: 600; color: #00ff88; }
        .status-dot { width: 8px; height: 8px; background: #00ff88; border-radius: 50%; display: inline-block; }
        .hidden { display: none !important; }
        .blank-page {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #0a0a12;
            color: #6a6a8a;
            font-size: 24px;
            flex-direction: column;
            gap: 20px;
        }
        .blank-page .icon { font-size: 80px; }
    </style>
</head>
<body>

    <!-- ===== BLANK PAGE (Hidden by default) ===== -->
    <div id="blankPage" class="blank-page hidden">
        <div class="icon">📺</div>
        <div>Stream is currently paused</div>
        <div style="font-size: 14px; color: #3a3a4e;">Please check back later</div>
    </div>

    <!-- ===== PLAYER PAGE ===== -->
    <div id="playerPage">
        <div class="container">
            <div class="player-wrapper">
                <video id="my-video" class="video-js" controls preload="auto" playsinline></video>
            </div>
            <div class="status-bar">
                <div class="status-item">
                    <span class="status-dot"></span>
                    <span class="label">स्थिति:</span>
                    <span class="value" id="statusText">तैयार</span>
                </div>
                <div class="status-item">
                    <span class="label"><i class="fas fa-microchip"></i> प्लेयर:</span>
                    <span class="value" id="playerInfo">Video.js</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        /**
         * ================================================================
         *  🎬 LIVE STREAM - API Based Remote Control
         *  - Checks localStorage every 3 seconds
         *  - If status is 'paused' → show blank page
         *  - If status is 'playing' → show video
         * ================================================================
         */

        const VIDEO_URL = "https://vs.classplusapp.com/hls/6a718806e15274f80f0ea83c/720p20.m3u8";
        const API_KEY = 'videoStatus';
        const blankPage = document.getElementById('blankPage');
        const playerPage = document.getElementById('playerPage');
        const statusText = document.getElementById('statusText');
        const playerInfo = document.getElementById('playerInfo');

        let player = null;

        // ============================================================
        // 🎬 INIT PLAYER
        // ============================================================

        function initPlayer() {
            if (player) {
                player.dispose();
                player = null;
            }

            player = videojs('my-video', {
                controls: true,
                autoplay: false,
                preload: 'auto',
                fluid: true,
                html5: {
                    hls: {
                        enableWorker: true,
                        lowLatencyMode: true,
                        maxBufferLength: 30,
                        xhrSetup: function(xhr, url) {
                            xhr.setRequestHeader('Referer', '');
                            try {
                                delete xhr._headers['Referer'];
                            } catch(e) {}
                        }
                    }
                }
            });

            player.ready(function() {
                console.log('✅ Player Ready');
                statusText.textContent = '✅ तैयार';
                playerInfo.textContent = 'Video.js + hls.js';
            });

            player.on('error', function() {
                const error = player.error();
                console.error('❌ Player Error:', error);
                statusText.textContent = '❌ एरर';
            });

            player.on('waiting', function() {
                statusText.textContent = '⏳ बफर...';
            });

            player.on('playing', function() {
                statusText.textContent = '✅ चल रहा है';
            });

            return player;
        }

        // ============================================================
        // 🎬 LOAD VIDEO
        // ============================================================

        function loadVideo() {
            if (!player) {
                player = initPlayer();
            }

            try {
                player.src({
                    src: VIDEO_URL,
                    type: 'application/x-mpegURL'
                });
                player.play().catch(() => {
                    statusText.textContent = '⚠️ प्ले करें';
                });
            } catch (error) {
                console.error('❌ Load error:', error);
            }
        }

        // ============================================================
        // 🔄 CHECK STATUS - Every 3 seconds (API Polling)
        // ============================================================

        function checkStatus() {
            const status = localStorage.getItem(API_KEY) || 'playing';
            console.log('📊 Status:', status);

            if (status === 'paused') {
                // Show blank page, hide player
                blankPage.classList.remove('hidden');
                playerPage.classList.add('hidden');
                if (player) {
                    player.pause();
                }
            } else {
                // Show player, hide blank page
                blankPage.classList.add('hidden');
                playerPage.classList.remove('hidden');
                if (!player) {
                    initPlayer();
                    loadVideo();
                } else if (player.paused()) {
                    player.play().catch(() => {});
                }
            }
        }

        // ============================================================
        // 🚀 PAGE LOAD
        // ============================================================

        document.addEventListener('DOMContentLoaded', function() {
            // Initial check
            checkStatus();
            
            // Check every 3 seconds
            setInterval(checkStatus, 3000);

            console.log('✅ Live Stream with API Remote Control initialized!');
            console.log('💡 Admin panel se "Pause" karein → blank page');
            console.log('💡 Admin panel se "Play" karein → video start');
        });

        // ============================================================
        // 🔄 AUTO-RETRY - Stalled Recovery
        // ============================================================

        setInterval(function() {
            if (!player) return;
            if (!player.paused() && player.readyState < 3) {
                try {
                    const tech = player.tech({ IWillNotUseThisInPlugins: true });
                    if (tech && tech.vhs && tech.vhs.buffer && tech.vhs.buffer.length === 0) {
                        console.log('🔄 Buffer empty, reloading...');
                        player.src({ src: VIDEO_URL, type: 'application/x-mpegURL' });
                        player.play().catch(() => {});
                    }
                } catch (e) {}
            }
        }, 5000);
    </script>

</body>
</html>
