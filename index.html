<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Video Control</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        /* ================================================================
           CSS - Admin Panel Dark Theme
           ================================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a12;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: #1a1a2e;
            border-radius: 16px;
            padding: 30px;
            border: 1px solid #2a2a4e;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
        }

        .hidden {
            display: none !important;
        }

        /* ===== LOGIN PAGE ===== */
        #loginPage {
            text-align: center;
        }

        .lock-icon {
            font-size: 60px;
            margin-bottom: 15px;
        }

        .login-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .login-subtitle {
            color: #a0a0b8;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .login-input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 10px;
            border: 1px solid #2a2a4e;
            background: #0f0f23;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
            font-family: 'Segoe UI', sans-serif;
        }

        .login-input:focus {
            border-color: #f7971e;
            box-shadow: 0 0 0 3px rgba(247, 151, 30, 0.15);
        }

        .login-input::placeholder {
            color: #6a6a8a;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            color: #0a0a12;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Segoe UI', sans-serif;
        }

        .login-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 30px rgba(247, 151, 30, 0.35);
        }

        .login-error {
            color: #ff6b6b;
            font-size: 14px;
            margin-top: 12px;
            min-height: 20px;
        }

        /* ===== ADMIN PANEL ===== */
        #adminPanel {
            text-align: center;
        }

        .admin-icon {
            font-size: 50px;
            margin-bottom: 10px;
        }

        .admin-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 5px;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .admin-subtitle {
            color: #a0a0b8;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .status-box {
            background: #12121e;
            border-radius: 10px;
            padding: 15px;
            border: 1px solid #2a2a4e;
            margin-bottom: 20px;
        }

        .status-box .label {
            color: #a0a0b8;
            font-size: 13px;
        }

        .status-box .value {
            font-size: 18px;
            font-weight: 700;
            margin-top: 5px;
        }

        .status-box .value.online {
            color: #00ff88;
        }

        .status-box .value.offline {
            color: #ff6b6b;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 14px 30px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Segoe UI', sans-serif;
            flex: 1;
            min-width: 120px;
        }

        .btn-pause {
            background: linear-gradient(135deg, #ff0044, #cc0033);
            color: #fff;
            box-shadow: 0 4px 20px rgba(255, 0, 68, 0.3);
        }

        .btn-pause:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 30px rgba(255, 0, 68, 0.5);
        }

        .btn-pause:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-resume {
            background: linear-gradient(135deg, #00ff88, #00cc66);
            color: #0a0a12;
            box-shadow: 0 4px 20px rgba(0, 255, 136, 0.3);
        }

        .btn-resume:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 30px rgba(0, 255, 136, 0.5);
        }

        .btn-resume:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-refresh {
            background: #0f0f23;
            border: 1px solid #2a2a4e;
            color: #a0a0b8;
            padding: 14px 20px;
            flex: 0.5;
            min-width: 60px;
        }

        .btn-refresh:hover {
            border-color: #f7971e;
            color: #fff;
        }

        .message {
            margin-top: 15px;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }

        .message.show {
            display: block;
        }

        .message.success {
            color: #00ff88;
            background: rgba(0, 255, 136, 0.08);
            border-left: 3px solid #00ff88;
        }

        .message.error {
            color: #ff6b6b;
            background: rgba(255, 0, 0, 0.08);
            border-left: 3px solid #ff6b6b;
        }

        .message.info {
            color: #f7971e;
            background: rgba(247, 151, 30, 0.08);
            border-left: 3px solid #f7971e;
        }

        .footer {
            margin-top: 20px;
            text-align: center;
            color: #6a6a8a;
            font-size: 12px;
            border-top: 1px solid #1a1a3e;
            padding-top: 18px;
        }

        .footer .highlight {
            color: #f7971e;
        }

        .last-updated {
            color: #6a6a8a;
            font-size: 11px;
            margin-top: 8px;
        }

        @media (max-width: 480px) {
            .container { padding: 20px; }
            .btn { min-width: 100px; padding: 12px 20px; font-size: 14px; }
            .btn-group { flex-direction: column; }
            .btn-refresh { flex: 1; }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ===== LOGIN PAGE ===== -->
        <div id="loginPage">
            <div class="lock-icon">🔐</div>
            <div class="login-title">Admin Login</div>
            <div class="login-subtitle">Enter your credentials to control the stream</div>
            <input type="password" class="login-input" id="passwordInput" placeholder="Enter password" autofocus>
            <button class="login-btn" onclick="login()">🔓 Login</button>
            <div id="loginError" class="login-error"></div>
        </div>

        <!-- ===== ADMIN PANEL ===== -->
        <div id="adminPanel" class="hidden">
            <div class="admin-icon">🎬</div>
            <div class="admin-title">Video Control</div>
            <div class="admin-subtitle">Play or pause the live stream remotely</div>

            <!-- Status Box -->
            <div class="status-box">
                <div class="label">📊 Current Status</div>
                <div class="value" id="statusValue">
                    <span id="statusText">Checking...</span>
                </div>
            </div>

            <!-- Buttons -->
            <div class="btn-group">
                <button class="btn btn-pause" id="pauseBtn" onclick="pauseVideo()">
                    ⏸️ Pause Video
                </button>
                <button class="btn btn-resume" id="resumeBtn" onclick="resumeVideo()">
                    ▶️ Play Video
                </button>
                <button class="btn btn-refresh" onclick="fetchStatus()" title="Refresh Status">
                    🔄
                </button>
            </div>

            <!-- Message -->
            <div id="adminMessage" class="message"></div>

            <!-- Last Updated -->
            <div class="last-updated" id="lastUpdated">Last updated: --</div>

            <div class="footer">
                ⚡ <span class="highlight">Remote Control</span> — API Based
            </div>
        </div>

    </div>

    <script>
        /**
         * ================================================================
         *  🎬 ADMIN PANEL - API Based Video Control
         *  - Password protected login
         *  - Uses localStorage API to communicate with website
         *  - Play/Pause video remotely
         * ================================================================
         */

        // ============================================================
        // 🔑 CONFIGURATION
        // ============================================================

        // ⭐⭐⭐ CHANGE THIS PASSWORD ⭐⭐⭐
        const ADMIN_PASSWORD = "admin123";

        // API endpoint (localStorage is used as API)
        const API_KEY = 'videoStatus';

        // ============================================================
        // 📦 DOM REFS
        // ============================================================
        const loginPage = document.getElementById('loginPage');
        const adminPanel = document.getElementById('adminPanel');
        const passwordInput = document.getElementById('passwordInput');
        const loginError = document.getElementById('loginError');

        const statusText = document.getElementById('statusText');
        const pauseBtn = document.getElementById('pauseBtn');
        const resumeBtn = document.getElementById('resumeBtn');
        const adminMessage = document.getElementById('adminMessage');
        const lastUpdated = document.getElementById('lastUpdated');

        // ============================================================
        // 🔐 LOGIN
        // ============================================================

        function login() {
            const password = passwordInput.value.trim();

            if (password === ADMIN_PASSWORD) {
                loginPage.classList.add('hidden');
                adminPanel.classList.remove('hidden');
                loginError.textContent = '';
                fetchStatus();
                // Auto refresh every 3 seconds
                setInterval(fetchStatus, 3000);
            } else {
                loginError.textContent = '❌ Invalid password! Please try again.';
                passwordInput.value = '';
                passwordInput.focus();
            }
        }

        // Enter key support for login
        passwordInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                login();
            }
        });

        // ============================================================
        // 📊 FETCH CURRENT STATUS (API Call)
        // ============================================================

        function fetchStatus() {
            // API call to get current status
            const status = localStorage.getItem(API_KEY) || 'playing';
            updateUI(status);
        }

        function updateUI(status) {
            if (status === 'playing') {
                statusText.textContent = '▶️ Playing';
                statusText.className = 'value online';
                pauseBtn.disabled = false;
                resumeBtn.disabled = true;
            } else if (status === 'paused') {
                statusText.textContent = '⏸️ Paused';
                statusText.className = 'value offline';
                pauseBtn.disabled = true;
                resumeBtn.disabled = false;
            } else {
                statusText.textContent = '⚠️ Unknown';
                statusText.className = 'value';
                pauseBtn.disabled = true;
                resumeBtn.disabled = true;
            }

            // Update last updated
            const now = new Date();
            lastUpdated.textContent = 'Last updated: ' + now.toLocaleTimeString();

            // Clear any old message
            hideAdminMessage();
        }

        // ============================================================
        // ⏸️ PAUSE VIDEO (API Call)
        // ============================================================

        function pauseVideo() {
            if (pauseBtn.disabled) return;

            pauseBtn.disabled = true;
            pauseBtn.textContent = '⏳ Processing...';
            showAdminMessage('⏳ Pausing video...', 'info');

            try {
                // API call to set status to paused
                localStorage.setItem(API_KEY, 'paused');
                showAdminMessage('✅ Video paused! Website will show blank page.', 'success');
                setTimeout(fetchStatus, 500);
            } catch (error) {
                console.error('❌ Pause error:', error);
                showAdminMessage('❌ Failed to pause: ' + error.message, 'error');
                pauseBtn.disabled = false;
                pauseBtn.textContent = '⏸️ Pause Video';
            }
        }

        // ============================================================
        // ▶️ RESUME VIDEO (API Call)
        // ============================================================

        function resumeVideo() {
            if (resumeBtn.disabled) return;

            resumeBtn.disabled = true;
            resumeBtn.textContent = '⏳ Processing...';
            showAdminMessage('⏳ Resuming video...', 'info');

            try {
                // API call to set status to playing
                localStorage.setItem(API_KEY, 'playing');
                showAdminMessage('✅ Video resumed! Website will show live stream.', 'success');
                setTimeout(fetchStatus, 500);
            } catch (error) {
                console.error('❌ Resume error:', error);
                showAdminMessage('❌ Failed to resume: ' + error.message, 'error');
                resumeBtn.disabled = false;
                resumeBtn.textContent = '▶️ Play Video';
            }
        }

        // ============================================================
        // 📢 MESSAGE HELPER
        // ============================================================

        function showAdminMessage(msg, type) {
            adminMessage.textContent = msg;
            adminMessage.className = 'message show ' + type;
        }

        function hideAdminMessage() {
            adminMessage.className = 'message';
            adminMessage.textContent = '';
        }

        console.log('✅ Admin Panel loaded!');
        console.log('🔑 Password:', ADMIN_PASSWORD);
        console.log('💡 Use "Pause" to show blank page on website');
        console.log('💡 Use "Play" to show video on website');
        console.log('📡 API Key:', API_KEY);
    </script>

</body>
</html>
